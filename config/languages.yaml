# Language catalogue for the channel.
#
# This file is the *seed/default* configuration. In Stage 6 the dashboard will
# let the creator enable additional languages; dashboard choices are stored in
# the database and take precedence over these defaults (see docs/architecture.md).
#
# Codes:
#   code          BCP-47 tag used for YouTube metadata localizations and the
#                 caption track `snippet.language`.
#   caption_tlang ISO 639-1 two-letter code passed to `captions.download?tlang=`
#                 (the API documents tlang as ISO 639-1).
version: 1

source_language:
  code: tr
  name: Turkish
  native_name: Türkçe

# Proper nouns, brand names, and channel identifiers that must be preserved verbatim
# across metadata and subtitle translations.
protected_glossary:
  - HayataDairPüfNoktalar
  - "@orchidhacks"

target_languages:
